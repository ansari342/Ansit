<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ansit - Meditative Quran Looper</title>
  <style>
    :root {
      --bg: #080b11;
      --card-bg: #121726;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --accent: #9bbfff;
      --border: #1e293b;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      text-align: center;
    }
    .card {
      max-width: 500px;
      background: var(--card-bg);
      padding: 48px 32px;
      border-radius: 20px;
      border: 1px solid var(--border);
    }
    h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }
    p {
      color: var(--text-muted);
      font-size: 16px;
      margin-bottom: 32px;
    }
    .links {
      display: flex;
      gap: 16px;
      justify-content: center;
    }
    .btn {
      background: var(--accent);
      color: #080b11;
      padding: 12px 24px;
      border-radius: 10px;
      font-weight: 700;
      text-decoration: none;
    }
    .btn-secondary {
      background: transparent;
      color: var(--text-main);
      border: 1px solid var(--border);
    }
    .btn:hover {
      opacity: 0.9;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Ansit</h1>
    <p>Distraction-free, meditative Quran verse looping and memorization for iOS.</p>
    <div class="links">
      <a href="privacy.html" class="btn btn-secondary">Privacy Policy</a>
      <a href="support.html" class="btn">Support & FAQ</a>
    </div>
  </div>
</body>
</html>
